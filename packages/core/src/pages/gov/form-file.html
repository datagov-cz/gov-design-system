<!DOCTYPE html>
<html dir="ltr" lang="cs">

<head>
	<script>
		window.GOV_DS_CONFIG = {
			canValidateWcagOnRender: true,
			iconsPath: '../assets/icons'
		}
	</script>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
	<title>Design System | Stencil</title>
	<link rel="stylesheet" href="../../build/core.css">
	<link rel="stylesheet" href="../../assets/fonts/roboto.css">
	<script type="module" src="../../build/core.esm.js"></script>
	<script nomodule src="../../build/core.js"></script>
</head>

<body>
	<form method="POST" action="./" enctype="multipart/form-data">
		<gov-form-control>
			<gov-form-group>
				<gov-form-file accept=".txt,.jsonld" expanded="true" name="files">
					<span>Přetáhněte soubor nebo</span>
					<p><gov-button color="primary" size="m" type="outlined">Nahrát ze zařízení</gov-button></p>
					<span class="gov-form-file__note">Podporované formáty ...</span>
				</gov-form-file>
			</gov-form-group>
		</gov-form-control>
		<gov-button color="primary" type="solid" size="m" native-type="submit">
			Vložit záznam
		</gov-button>
	</form>
</body>

</html>
